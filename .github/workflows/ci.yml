name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-secrets:
    name: No secrets in tracked files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scan for secrets
        run: node scripts/check-secrets.mjs
